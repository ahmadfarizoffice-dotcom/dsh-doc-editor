name: CI

# Every push to main and every pull request must pass:
#   quality     - lint, typecheck, formatting
#   test        - unit + integration suites and the golden DOCX fixture
#   build       - full workspace build with artifact assertions
#   mcp-schemas - MCP tool manifest validation against the JSON Schema contract
#   doc-fixture - explicit fixture regression run with render artifacts uploaded
#
# A failing test or build fails the workflow; no step may be allowed to fail
# silently. Job results are the gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by design: CI needs no repository write access and no credentials.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (lint, types, formatting)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pnpm version is pinned once, in package.json "packageManager".
      # Passing a second version here makes pnpm/action-setup fail with
      # "Multiple versions of pnpm specified", so no version input is set.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Formatting is only enforced when the workspace actually declares the
      # script; skipping is explicit rather than silently ignoring failures.
      - name: Detect optional quality scripts
        id: scripts
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const scripts = JSON.parse(readFileSync('package.json', 'utf8')).scripts ?? {};
            console.log('format_check=' + String(Boolean(scripts['format:check'])));
          " >> "$GITHUB_OUTPUT"

      - name: Check formatting
        if: steps.scripts.outputs.format_check == 'true'
        run: pnpm run format:check

      - name: Note skipped formatting check
        if: steps.scripts.outputs.format_check != 'true'
        run: echo "No 'format:check' script is declared in package.json; formatting is not enforced by CI yet."

  test:
    name: Tests (unit + integration + fixture)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm run build:core

      - name: Run unit and integration tests
        run: pnpm test

      - name: Run golden DOCX fixture regression
        run: pnpm run test:fixture

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Assert build artifacts exist
        run: |
          set -euo pipefail
          if [ ! -f apps/web/dist-client/index.html ]; then
            echo "::error::missing apps/web/dist-client/index.html"
            exit 1
          fi
          if [ ! -f apps/mcp/dist/main.js ]; then
            echo "::error::missing apps/mcp/dist/main.js"
            exit 1
          fi
          echo "build artifacts present: apps/web/dist-client/index.html, apps/mcp/dist/main.js"

      - name: Build and validate the DSH bundle
        run: |
          pnpm run build:plugin
          pnpm run plugin:check

      - name: Validate agent integration packages
        run: pnpm run integrations:check

      # The MCP tool manifest is produced by the server build; hand it to the
      # schema job instead of installing and building twice.
      - name: Upload MCP build output
        uses: actions/upload-artifact@v4
        with:
          name: mcp-dist
          path: apps/mcp/dist
          if-no-files-found: error
          retention-days: 1

  mcp-schemas:
    name: Validate MCP tool schemas
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Download MCP build output
        uses: actions/download-artifact@v4
        with:
          name: mcp-dist
          path: apps/mcp/dist

      - name: Validate tools.json
        run: node tools/validate-mcp-schemas.mjs

  doc-fixture:
    name: DOCX fixture regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fixture regression explicitly
        run: pnpm exec vitest run test/fixture

      - name: Upload generated render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-fixture-render-output
          path: fixtures/generated
          if-no-files-found: ignore
          retention-days: 7

  # Validates docs/RELEASE-CHECKLIST.md and docs/QUALITY-GATES.md exist and
  # contain the headings the release process depends on. Runs the pure-node
  # gate tool, so it needs no dependency install.
  release-docs:
    name: Release docs gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Validate release docs
        run: node tools/coverage.mjs --docs

  # Runs the real coverage tooling and fails on a genuine regression only.
  # tools/coverage.mjs exits 0 with status "unavailable" when the coverage
  # provider is missing, so a missing provider never fails the build; it exits
  # 1 when a floor is missed or a test fails, and 2 for a configuration error.
  quality-coverage:
    name: Coverage floors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run coverage gate
        run: pnpm run coverage:gate

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gate
          path: |
            coverage/report.json
            coverage/decision-table.json
            coverage/raw
          if-no-files-found: warn
          retention-days: 7

  # Fuzz, differential and chaos suites are not implemented yet. This job
  # detects them and runs them when they exist; when they do not exist it
  # records the gap (the release checklist marks those gates BLOCKED) instead
  # of fabricating a pass. It fails the build only on a real suite failure.
  fuzz:
    name: Fuzz and fault injection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect quality suites
        id: suites
        run: |
          node --input-type=module -e "
            import { readdirSync, existsSync } from 'node:fs';
            const roots = ['test/quality', 'test/fuzz', 'packages/core/test/fuzz'];
            const files = [];
            for (const root of roots) {
              if (!existsSync(root)) continue;
              for (const entry of readdirSync(root, { recursive: true })) {
                const name = String(entry).replace(/\\\\/g, '/');
                if (/\.test\.(ts|mjs)\$/.test(name)) files.push(root + '/' + name);
              }
            }
            console.log('present=' + String(files.length > 0));
            console.log('files=' + (files.join(',') || 'none'));
            if (files.length === 0) {
              console.log('::notice::No fuzz/differential/chaos suites found. They are recorded as BLOCKED in docs/RELEASE-CHECKLIST.md; this is not a pass.');
            }
          " >> "$GITHUB_OUTPUT"

      - name: Run fuzz, differential and chaos suites
        if: steps.suites.outputs.present == 'true'
        run: |
          FUZZ_REPORT_DIR=coverage/fuzz FUZZ_SEED=1337 FUZZ_CASES=150 pnpm exec vitest run test/quality test/fuzz packages/core/test/fuzz

      - name: Upload quality suite reports
        if: always() && steps.suites.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quality-suite-reports
          path: coverage/fuzz
          if-no-files-found: warn
          retention-days: 7

      - name: Record missing quality suites
        if: steps.suites.outputs.present != 'true'
        run: echo "No fuzz/differential/chaos suites present; nothing was exercised. Gates stay BLOCKED."
